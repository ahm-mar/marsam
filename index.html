<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>مرسم الكيمياء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: drafting desk — tool rail at the reading edge (right in RTL), white drawing paper in the middle,
   formula / molar-mass strip along the bottom like the data line under a lab sketch. Paper stays white in both themes. */
:root{
  --bg:#e9edf3; --surface:#f6f8fb; --raise:#ffffff; --ink:#172030; --muted:#5a6578; --line:#d2d8e2;
  --accent:#2047c9; --accent-ink:#ffffff; --accent-soft:#dfe6fb; --danger:#b8322a;
  --paper:#ffffff; --dot:#d8dee8; --shadow:0 1px 2px rgba(20,30,60,.08),0 6px 24px rgba(20,30,60,.08);
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --surface:#161b24; --raise:#1d232f; --ink:#e6eaf2; --muted:#9aa4b5; --line:#2a3241;
  --accent:#7f9cff; --accent-ink:#0d1222; --accent-soft:#232f58; --danger:#ff7b70;
  --paper:#ffffff; --dot:#dbe0e8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --surface:#161b24; --raise:#1d232f; --ink:#e6eaf2; --muted:#9aa4b5; --line:#2a3241;
  --accent:#7f9cff; --accent-ink:#0d1222; --accent-soft:#232f58; --danger:#ff7b70;
  --paper:#ffffff; --dot:#dbe0e8; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top{display:flex;align-items:center;gap:10px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:none}
.top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;flex:none;padding-inline-end:6px}
.brand b{font-size:17px;font-weight:700;letter-spacing:0}
.brand small{font-size:12px;color:var(--muted);font-weight:500}
.brand svg{color:var(--accent)}
.grp{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;flex:none}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;min-width:30px;padding:0 8px;border:0;border-radius:6px;background:transparent;font-size:13px;white-space:nowrap}
.tb:hover:not(:disabled){background:var(--accent-soft)}
.tb:disabled{opacity:.38;cursor:default}
.tb svg{flex:none}
.tb.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 12px}
.tb.primary:hover{background:var(--accent);filter:brightness(1.08)}
.zoomv{font-family:var(--mono);font-size:12px;min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.wordbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px;flex:none}
.wordbar .lbl{font-size:12px;color:var(--muted);margin-inline-start:4px}
.wordbar .tb{background:var(--raise)}
.wordbar .tb.primary{background:var(--accent)}
.wordbar input[type=range]{width:90px}
.wsz{display:inline-flex;align-items:center;gap:6px}
.wmsg{font-size:12px;color:var(--muted);flex-basis:100%}
.wmsg:empty{display:none}
.main{flex:1;min-height:0;display:flex;gap:8px}
.rail{width:136px;flex:none;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;scrollbar-width:thin}
.rail h6{margin:8px 2px 4px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.rail h6:first-child{margin-top:0}
.tg{display:grid;grid-template-columns:repeat(3,36px);gap:4px}
.tool{width:36px;height:36px;border:1px solid transparent;border-radius:8px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;font-family:Arial,sans-serif;font-size:15px;font-weight:600;color:var(--ink)}
.tool:hover{background:var(--raise);border-color:var(--line)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool.el{font-size:15px}
.tool small{font-size:10px}
.stage{flex:1;min-width:0;position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
#cv{display:block;width:100%;height:100%;touch-action:none;direction:ltr;user-select:none;-webkit-user-select:none;cursor:crosshair}
#cv.c-select{cursor:default}#cv.c-pan,#cv.panning{cursor:grab}#cv.c-text{cursor:text}
.hint{position:absolute;inset-inline-start:10px;bottom:10px;max-width:calc(100% - 20px);background:rgba(23,32,48,.82);color:#fff;font-size:12px;line-height:1.5;padding:5px 10px;border-radius:7px;pointer-events:none}
.opts{position:absolute;inset-inline-end:10px;top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid #d5dbe5;background:#fff;color:#1d2636;font-size:12px}
.chipbtn input{accent-color:#2047c9}
.inline-ed{position:absolute;z-index:5;font:20px Arial,sans-serif;padding:2px 6px;border:2px solid #2047c9;border-radius:6px;background:#fff;color:#111;min-width:60px;direction:ltr;text-align:left;outline:none;box-shadow:0 4px 16px rgba(32,71,201,.2)}
.info{flex:none;display:flex;align-items:center;gap:8px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.frags{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-block:1px}
.frag{flex:none;display:flex;align-items:baseline;gap:10px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:5px 10px;font-size:13px}
.frag.on{border-color:var(--accent)}
.frag .f{font-family:var(--mono);font-weight:500;direction:ltr;unicode-bidi:isolate}
.frag .m{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.frag sub,.frag sup,.wf sub,.wf sup{font-size:.72em;line-height:0}
.frag.tot{background:var(--accent-soft)}
.empty{font-size:12.5px;color:var(--muted);padding:4px 6px}
.ea{display:flex;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);direction:ltr;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--raise);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);max-height:100%;overflow:auto;padding:18px 20px}
.dlg h3{margin:0 0 4px;font-size:18px;text-wrap:balance}
.dlg p.sub{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.6}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.dlg label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);flex:1;min-width:140px}
.dlg input[type=text],.dlg input[type=number],.dlg select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;color:var(--ink);font-size:14px}
.dlg .ltr{direction:ltr;text-align:left;font-family:var(--mono)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:hover{filter:brightness(1.04)}
.geo{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.geo button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.geo button.on{border-color:var(--accent);background:var(--accent-soft)}
.geo svg{color:var(--ink)}
.prev{font-family:var(--mono);font-size:15px;direction:ltr;text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.ptwrap{overflow-x:auto}
.pt{display:grid;grid-template-columns:repeat(18,34px);grid-template-rows:repeat(7,38px) 10px repeat(2,38px);gap:2px;direction:ltr;width:max-content}
.pt button{border:1px solid var(--line);border-radius:5px;background:var(--surface);font-family:Arial,sans-serif;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
.pt button small{font-size:8.5px;font-weight:400;color:var(--muted)}
.pt button:hover{border-color:var(--accent);background:var(--accent-soft)}
.pt .gap{grid-column:1/-1;height:8px}
.pt .k-nm{background:color-mix(in srgb,var(--surface) 82%,#3aa46a)}
.pt .k-ng{background:color-mix(in srgb,var(--surface) 80%,#7a5cc8)}
.pt .k-am{background:color-mix(in srgb,var(--surface) 80%,#d9534f)}
.pt .k-ae{background:color-mix(in srgb,var(--surface) 80%,#e39b3a)}
.pt .k-tm{background:color-mix(in srgb,var(--surface) 84%,#3b77d6)}
.pt .k-ln{background:color-mix(in srgb,var(--surface) 82%,#c75ba8)}
.pt .k-md{background:color-mix(in srgb,var(--surface) 82%,#3fb6b6)}
.pt .k-hl{background:color-mix(in srgb,var(--surface) 80%,#a0c43a)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:baseline}
.keys kbd{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;direction:ltr;display:inline-block;white-space:nowrap}
.expimg{display:block;max-width:100%;max-height:46vh;margin:0 auto;background:repeating-conic-gradient(#eef1f5 0% 25%,#fff 0% 50%) 50%/16px 16px;border:1px solid var(--line);border-radius:8px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172030;color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.in-dialog .brand small{display:none}
@media (max-width:700px){
  .app{gap:6px;padding-block:6px}
  .brand small{display:none}
  .main{flex-direction:column;gap:6px}
  .rail{width:auto;height:auto;overflow-x:auto;overflow-y:hidden;display:flex;gap:4px;align-items:center;padding:4px;flex:none}
  .rail h6{display:none}
  .tg{display:flex;gap:2px}
  .rail .tg+h6+.tg{border-inline-start:1px solid var(--line);padding-inline-start:4px}
  .tool{width:34px;height:34px}
  .info{flex-wrap:wrap}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app" id="app" dir="rtl">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2.5l9.1 5.25v10.5L13 23.5l-9.1-5.25V7.75z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 7.3l5 2.9M8 15.6v-5.2M13 18.7l5-2.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <b>مِرسَم</b><small>الكيمياء</small>
    </div>
    <div class="grp">
      <button class="tb" data-act="new" title="رسم جديد">جديد</button>
      <button class="tb" data-act="open" title="فتح ملف رسم أو صورة PNG من مرسم">فتح</button>
      <button class="tb" data-act="save" title="حفظ الرسم كملف">حفظ</button>
      <button class="tb" data-act="export" title="تصدير صورة PNG أو SVG">صورة</button>
    </div>
    <div class="grp">
      <button class="tb" data-act="undo" title="تراجع (Ctrl+Z)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 8l4 4-4 4"/><path d="M19 12H9a5 5 0 0 0 0 10h2"/></svg></button>
      <button class="tb" data-act="redo" title="إعادة (Ctrl+Y)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 8l-4 4 4 4"/><path d="M5 12h10a5 5 0 0 1 0 10h-2"/></svg></button>
    </div>
    <div class="grp" id="selgrp">
      <button class="tb" data-act="rotl" title="تدوير عكس عقارب الساعة 15°"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 3v4h4"/></svg></button>
      <button class="tb" data-act="rotr" title="تدوير مع عقارب الساعة 15°"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v4h-4"/></svg></button>
      <button class="tb" data-act="fliph" title="قلب أفقي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M9 6L3 18h6zM15 6l6 12h-6z"/></svg></button>
      <button class="tb" data-act="flipv" title="قلب رأسي"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12h18" stroke-dasharray="2 2"/><path d="M6 9L18 3v6zM6 15l12 6v-6z"/></svg></button>
      <button class="tb" data-act="dup" title="تكرار المحدد (Ctrl+D)">نسخ</button>
      <button class="tb" data-act="del" title="حذف المحدد (Delete)">حذف</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="tb" data-act="zout" title="تصغير">−</button>
      <span class="zoomv" id="zoomv">100%</span>
      <button class="tb" data-act="zin" title="تكبير">+</button>
      <button class="tb" data-act="fit" title="ملاءمة الرسم للشاشة">ملاءمة</button>
    </div>
    <div class="grp">
      <button class="tb" data-act="help" title="الاختصارات وطريقة الربط مع Word">مساعدة</button>
    </div>
  </header>

  <div class="wordbar" id="wordbar" hidden>
    <button class="tb primary" data-act="w-insert" id="w-insert">إدراج في Word</button>
    <button class="tb" data-act="w-load" id="w-load" title="حدّد رسماً من مرسم داخل المستند ثم اضغط هنا لتعديله">تحرير الرسم المحدد</button>
    <button class="tb" data-act="w-formula" title="إدراج الصيغة الجزيئية والكتلة المولية كنص في المستند">إدراج الصيغة</button>
    <button class="tb" data-act="w-big" id="w-big" title="فتح المرسم في نافذة كبيرة">نافذة كبيرة</button>
    <button class="tb" data-act="w-cancel" id="w-cancel" hidden>إغلاق</button>
    <span class="wsz"><span class="lbl">الحجم</span>
    <input type="range" id="wscale" min="50" max="200" step="10" value="100" aria-label="حجم الرسم في Word">
    <span class="zoomv" id="wscalev">100%</span></span>
    <div class="wmsg" id="wmsg"></div>
  </div>

  <div class="main">
    <nav class="rail" id="rail" aria-label="أدوات الرسم"></nav>
    <div class="stage" id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#d8dee8"/></pattern></defs>
        <rect id="gridr" x="0" y="0" width="100%" height="100%" fill="url(#dots)"/>
        <g id="vp"><g id="lsel"></g><g id="ldoc"></g><g id="lov"></g></g>
      </svg>
      <input id="ed" class="inline-ed" hidden autocomplete="off" spellcheck="false">
      <div class="opts" id="opts"></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <footer class="info" id="info"></footer>
</div>

<div class="modal" id="modal" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<input type="file" id="file" accept=".json,.marsam,.png,application/json,image/png" hidden>

<script>

const ABK=Object.keys(ABBR).sort((a,b)=>b.length-a.length);
const LIGQ={Cl:-1,Br:-1,I:-1,F:-1,CN:-1,NC:-1,OH:-1,NO2:-1,ONO:-1,SCN:-1,NCS:-1,N3:-1,NH2:-1,H:-1,O:-2,S:-2,ox:-2,acac:-1,CO3:-2,SO4:-2,C2O4:-2,edta:-4,EDTA:-4,gly:-1,dmg:-1,OAc:-1,NO3:-1,ClO4:-1};
const ACOL={N:'#2340c8',O:'#cf2a1d',S:'#a07c00',P:'#cf6400',F:'#1c8a3c',Cl:'#1c8a3c',Br:'#8a3b14',I:'#6a2a9a',B:'#b0602a'};
const S_={color:false,formula:true,wscale:100,bg:false,expScale:4};
const MSIGN='−';

/* ================= document ================= */
let D=emptyDoc(), AM=new Map();
function emptyDoc(){return {v:1,atoms:[],bonds:[],arrows:[],texts:[],brackets:[],nid:1};}
const nid=()=>D.nid++;
function reindex(){AM=new Map(D.atoms.map(a=>[a.id,a]));}
const A=id=>AM.get(id);
function addAtom(x,y,el,extra){const a=Object.assign({id:nid(),x,y,el:el||'C',charge:0},extra||{});D.atoms.push(a);AM.set(a.id,a);return a;}
function bondBetween(i,j){return D.bonds.find(b=>(b.a===i&&b.b===j)||(b.a===j&&b.b===i));}
function addBond(a,b,order,style){if(!a||!b||a===b)return null;const ex=bondBetween(a.id,b.id);if(ex)return ex;const bd={id:nid(),a:a.id,b:b.id,order:order||1,style:style||'plain'};D.bonds.push(bd);return bd;}
function bondsOf(id){return D.bonds.filter(b=>b.a===id||b.b===id);}
function nbrs(id){const r=[];for(const b of D.bonds){if(b.a===id)r.push(A(b.b));else if(b.b===id)r.push(A(b.a));}return r.filter(Boolean);}
function removeAtom(id){D.bonds=D.bonds.filter(b=>b.a!==id&&b.b!==id);D.atoms=D.atoms.filter(a=>a.id!==id);AM.delete(id);}
function removeBond(bd){D.bonds=D.bonds.filter(b=>b!==bd);}
function cleanupOrphans(ids){for(const id of ids){const a=A(id);if(a&&a.el==='C'&&!a.label&&!a.charge&&!bondsOf(id).length)removeAtom(id);}}
function bondSum(id){let s=0;for(const b of D.bonds){if((b.a===id||b.b===id)&&b.style!=='coord'&&b.style!=='dashed')s+=b.order;}return s;}
function implicitH(a){
  if(a.label)return 0; const v=VAL[a.el]; if(!v)return 0;
  const c=a.charge||0, bs=bondSum(a.id); let adj;
  if(a.el==='C'||a.el==='Si'||a.el==='Ge'||a.el==='H')adj=-Math.abs(c); else if(a.el==='B'||a.el==='Al')adj=-c; else adj=c;
  for(const val of v){const t=val+adj;if(t>=bs)return t-bs;}
  return 0;
}
function isShown(a){
  if(a.label||a.el!=='C'||a.showC)return true;
  const bs=bondsOf(a.id);
  if(!bs.length)return true;
  if(bs.every(b=>b.style==='dashed'))return true;
  return bs.some(b=>b.style==='coord');
}

/* ================= formula parsing ================= */
function addC(t,s,k){for(const e in s)t[e]=(t[e]||0)+s[e]*(k==null?1:k);}
function parseGroup(s){
  let i=0;const st=[{}];
  const num=()=>{let m=s.slice(i).match(/^\d+/);if(m){i+=m[0].length;return +m[0];}return 1;};
  while(i<s.length){
    const c=s[i];
    if('([{'.includes(c)){st.push({});i++;continue;}
    if(')]}'.includes(c)){if(st.length<2)return null;i++;const n=num();const g=st.pop();addC(st[st.length-1],g,n);continue;}
    if(c==='+'||c==='-'||c===MSIGN||c==='^'){i++;while(i<s.length&&/[\d+\-−]/.test(s[i]))i++;continue;}
    let tok=null;for(const k of ABK){if(s.startsWith(k,i)){tok=k;break;}}
    if(tok){i+=tok.length;const n=num();addC(st[st.length-1],ABBR[tok],n);continue;}
    const m=s.slice(i).match(/^[A-Z][a-z]?/);
    if(m){let sym=m[0];if(!EM[sym]){sym=sym[0];if(!EM[sym])return null;}i+=sym.length;const n=num();const t=st[st.length-1];t[sym]=(t[sym]||0)+n;continue;}
    return null;
  }
  while(st.length>1){const g=st.pop();addC(st[st.length-1],g,1);}
  return st[0];
}
function parseFormula(str){
  const tot={};let ok=true;
  for(let part of String(str).replace(/\s+/g,'').split(/[·•.*]/)){
    if(!part)continue;let k=1;const m=part.match(/^(\d+)(.*)$/);if(m){k=+m[1];part=m[2];}
    const r=parseGroup(part);if(!r){ok=false;continue;}addC(tot,r,k);
  }
  return {counts:tot,ok};
}
function hill(c){
  const ks=Object.keys(c).filter(k=>c[k]>0);
  if(c.C)return ['C',...(c.H?['H']:[]),...ks.filter(k=>k!=='C'&&k!=='H').sort()].map(k=>[k,c[k]]);
  return ks.sort().map(k=>[k,c[k]]);
}
const molMass=c=>Object.keys(c).reduce((s,k)=>s+(EM[k]||0)*c[k],0);
const fmtHTML=h=>h.map(([e,n])=>e+(n>1?'<sub>'+n+'</sub>':'')).join('');
const fmtText=h=>h.map(([e,n])=>e+(n>1?n:'')).join('');
function chargeStr(c){if(!c)return '';const n=Math.abs(c);return (n>1?n:'')+(c>0?'+':MSIGN);}

function fragments(){
  const par=new Map();const f=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
  D.atoms.forEach(a=>par.set(a.id,a.id));
  D.bonds.forEach(b=>{if(b.style!=='dashed'&&par.has(b.a)&&par.has(b.b))par.set(f(b.a),f(b.b));});
  const g=new Map();
  for(const a of D.atoms){const r=f(a.id);if(!g.has(r))g.set(r,[]);g.get(r).push(a);}
  const out=[];
  for(const atoms of g.values()){
    const c={};let ok=true,q=0;
    for(const a of atoms){
      if(a.label){const p=parseFormula(a.label);if(!p.ok)ok=false;addC(c,p.counts);}
      else{c[a.el]=(c[a.el]||0)+1;const h=implicitH(a);if(h)c.H=(c.H||0)+h;}
      q+=a.charge||0;
    }
    out.push({atoms,counts:c,ok,charge:q,minx:Math.min(...atoms.map(a=>a.x))});
  }
  return out.sort((a,b)=>a.minx-b.minx);
}

/* ================= text measure / tokens ================= */
const MC=document.createElement('canvas').getContext('2d');const WC=new Map();
function tw(s,sz){const k=sz+'|'+s;let w=WC.get(k);if(w==null){MC.font=sz+'px '+FONT;w=MC.measureText(s).width;WC.set(k,w);}return w;}
function formulaTokens(s,toks){
  // letters normal; digits after letter / ) / ] subscript; trailing +/- (with digits) superscript
  let i=0;
  while(i<s.length){
    const c=s[i],prev=i?s[i-1]:'';
    const mm=s.slice(i).match(/^(\d*[+\-−])$/);
    if(mm&&i>0){toks.push({t:mm[1].replace('-',MSIGN),k:'sup'});break;}
    if(/\d/.test(c)&&/[A-Za-z)\]]/.test(prev)){let j=i;while(j<s.length&&/\d/.test(s[j]))j++;toks.push({t:s.slice(i,j),k:'sub'});i=j;continue;}
    const last=toks[toks.length-1];if(last&&last.k==='n'&&!last.lock)last.t+=c;else toks.push({t:c,k:'n'});
    i++;
  }
  return toks;
}
function richTokens(s,formula){
  // supports ^x / ^{..} superscript, _x / _{..} subscript; optional automatic chemistry subscripts
  const toks=[];let i=0;let buf='';
  const flush=()=>{if(!buf)return;if(formula){const segs=buf.split(/(\s+)/);for(const sg of segs){if(!sg)continue;if(/^\s+$/.test(sg))push(sg,'n');else formulaTokens(sg,[]).forEach(t=>push(t.t,t.k));}}else push(buf,'n');buf='';};
  const push=(t,k)=>{const l=toks[toks.length-1];if(l&&l.k===k)l.t+=t;else toks.push({t,k});};
  while(i<s.length){
    const c=s[i];
    if((c==='^'||c==='_')&&i+1<s.length){
      flush();let j=i+1,v='';
      if(s[j]==='{'){const e=s.indexOf('}',j);v=s.slice(j+1,e<0?s.length:e);j=e<0?s.length:e+1;}
      else{while(j<s.length&&!/\s/.test(s[j])&&s[j]!=='^'&&s[j]!=='_'){v+=s[j];j++;}}
      push(v.replace(/-/g,MSIGN),c==='^'?'sup':'sub');i=j;continue;
    }
    buf+=c;i++;
  }
  flush();
  return toks;
}
function layoutTokens(toks,x0,size){
  let x=x0;const sub=Math.round(size*0.7);
  for(const t of toks){t.sz=t.k==='n'?size:sub;t.w=tw(t.t,t.sz);t.x=x;x+=t.w;}
  return x;
}
function tokSVG(toks,y,fill,size){
  let s='';const dSub=size*0.3,dSup=-size*0.45;
  for(const t of toks){if(!t.t.trim())continue;const yy=y+(t.k==='sub'?dSub:t.k==='sup'?dSup:0);
    s+=`<text x="${r2(t.x)}" y="${r2(yy)}" font-family="${FONT}" font-size="${t.sz}" fill="${fill}">${esc(t.t)}</text>`;}
  return s;
}
const r2=v=>Math.round(v*100)/100;

/* ================= atom labels ================= */
function splitGroups(s){return s.match(/[A-Z][a-z]?\d*|[^A-Z]+/g)||[s];}
let LAY=new Map(), TL=new Map();
function atomColor(a){return S_.color?(ACOL[a.el]||(a.label?INK:(['C','H'].includes(a.el)?INK:'#6b3fa0'))):INK;}
function labelLayout(a){
  if(!isShown(a))return null;
  const nb=nbrs(a.id);let sdx=0;for(const n of nb){const d=Math.hypot(n.x-a.x,n.y-a.y)||1;sdx+=(n.x-a.x)/d;}
  let toks=[],anchor=0;
  if(a.label){
    let gs=splitGroups(a.label);
    const simple=gs.length>1&&gs.every(g=>/^[A-Z][a-z]?\d*$/.test(g))&&!ABBR[a.label];
    const rev=nb.length&&sdx>0.05&&simple;
    if(rev)gs=gs.slice().reverse();
    const ai=rev?gs.length-1:0;
    gs.forEach((g,i)=>{const t=formulaTokens(g,[]);t.forEach(x=>x.lock=true);if(i===ai)anchor=toks.length;toks.push(...t);});
    // merge adjacent normal tokens for nicer kerning but keep anchor split
  }else{
    const h=implicitH(a);
    const left=nb.length?sdx>0.05:['O','S','Se','Te','F','Cl','Br','I'].includes(a.el);
    const hT=[];if(h>0){hT.push({t:'H',k:'n'});if(h>1)hT.push({t:String(h),k:'sub'});}
    if(left&&h>0){toks.push(...hT);anchor=toks.length;toks.push({t:a.el,k:'n'});}
    else{toks.push({t:a.el,k:'n'});toks.push(...hT);}
  }
  if(a.charge)toks.push({t:chargeStr(a.charge),k:'sup'});
  // anchor = first char only
  const an=toks[anchor];
  const first=an.t.match(/^[A-Z][a-z]?|^./)[0];
  if(an.t.length>first.length){toks.splice(anchor+1,0,{t:an.t.slice(first.length),k:an.k});an.t=first;}
  layoutTokens(toks,0,FS);
  const off=a.x-(toks[anchor].x+toks[anchor].w/2);
  toks.forEach(t=>t.x+=off);
  const aw=toks[anchor].w;
  const last=toks[toks.length-1];
  return {toks,abox:{x1:a.x-aw/2-2.5,x2:a.x+aw/2+2.5,y1:a.y-10.5,y2:a.y+10.5},
          box:{x1:toks[0].x-1,x2:last.x+last.w+1,y1:a.y-14,y2:a.y+13}};
}

/* ================= geometry helpers ================= */
function exitPt(sx,sy,ex,ey,b){
  const dx=ex-sx,dy=ey-sy;
  const tx=dx>0?(b.x2-sx)/dx:dx<0?(b.x1-sx)/dx:Infinity;
  const ty=dy>0?(b.y2-sy)/dy:dy<0?(b.y1-sy)/dy:Infinity;
  let t=Math.min(tx,ty);if(!(t>0))t=0;if(t>0.9)t=0.9;
  return [sx+dx*t,sy+dy*t];
}
function trim(x1,y1,x2,y2,ba,bb){
  const p=ba?exitPt(x1,y1,x2,y2,ba):[x1,y1];
  const q=bb?exitPt(x2,y2,x1,y1,bb):[x2,y2];
  return [p[0],p[1],q[0],q[1]];
}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;const l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-t*dx,py-y1-t*dy);}
let ADJ=null;
function buildAdj(){ADJ=new Map();D.atoms.forEach(a=>ADJ.set(a.id,[]));for(const b of D.bonds){if(b.style==='dashed')continue;ADJ.get(b.a)?.push([b.b,b]);ADJ.get(b.b)?.push([b.a,b]);}}
function ringOf(bd){
  if(!ADJ)buildAdj();
  const prev=new Map([[bd.a,null]]);let q=[bd.a];
  for(let depth=0;depth<9&&q.length;depth++){
    const nq=[];
    for(const u of q){for(const [v,b] of ADJ.get(u)||[]){if(b===bd||prev.has(v))continue;prev.set(v,u);
      if(v===bd.b){const path=[];let x=v;while(x!=null){path.push(x);x=prev.get(x);}return path;}
      nq.push(v);}}
    q=nq;
  }
  return null;
}

/* ================= rendering of the document ================= */
function line(x1,y1,x2,y2,w,extra){return `<line x1="${r2(x1)}" y1="${r2(y1)}" x2="${r2(x2)}" y2="${r2(y2)}" stroke="${INK}" stroke-width="${w||LW}" stroke-linecap="round"${extra||''}/>`;}
function bondSVG(bd){
  const a=A(bd.a),b=A(bd.b);if(!a||!b)return '';
  const la=LAY.get(a.id),lb=LAY.get(b.id);const BA=la&&la.abox,BB=lb&&lb.abox;
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,px=-uy,py=ux;
  let s='';
  if(bd.order===1){
    const [x1,y1,x2,y2]=trim(a.x,a.y,b.x,b.y,BA,BB);
    switch(bd.style){
      case 'wedge':{const w=4.2;s+=`<polygon points="${r2(x1)},${r2(y1)} ${r2(x2+px*w)},${r2(y2+py*w)} ${r2(x2-px*w)},${r2(y2-py*w)}" fill="${INK}" stroke="${INK}" stroke-width="0.6" stroke-linejoin="round"/>`;break;}
      case 'hash':{const sl=Math.hypot(x2-x1,y2-y1),n=Math.max(4,Math.round(sl/4.6));for(let i=0;i<=n;i++){const t=i/n,cx=x1+(x2-x1)*t,cy=y1+(y2-y1)*t,w=0.6+3.8*t;s+=line(cx+px*w,cy+py*w,cx-px*w,cy-py*w,1.35);}break;}
      case 'wavy':{const sl=Math.hypot(x2-x1,y2-y1),n=Math.max(3,Math.round(sl/6));let d=`M${r2(x1)} ${r2(y1)}`;for(let i=0;i<n;i++){const t0=i/n,t1=(i+1)/n,tm=(t0+t1)/2,sg=i%2?1:-1;const cx=x1+(x2-x1)*tm+px*4*sg,cy=y1+(y2-y1)*tm+py*4*sg;d+=` Q${r2(cx)} ${r2(cy)} ${r2(x1+(x2-x1)*t1)} ${r2(y1+(y2-y1)*t1)}`;}s+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${LW}" stroke-linecap="round"/>`;break;}
      case 'bold':s+=line(x1,y1,x2,y2,4.6,' stroke-linecap="butt"');break;
      case 'dashed':s+=line(x1,y1,x2,y2,LW,' stroke-dasharray="3.5 3"');break;
      case 'coord':{const hx=x2-ux*8.5,hy=y2-uy*8.5;s+=line(x1,y1,hx+ux*1,hy+uy*1);s+=`<polygon points="${r2(x2)},${r2(y2)} ${r2(hx+px*3.6)},${r2(hy+py*3.6)} ${r2(hx-px*3.6)},${r2(hy-py*3.6)}" fill="${INK}"/>`;break;}
      default:s+=line(x1,y1,x2,y2);
    }
    return s;
  }
  if(bd.order===3){
    for(const o of [-DBS*0.85,0,DBS*0.85]){const [x1,y1,x2,y2]=trim(a.x+px*o,a.y+py*o,b.x+px*o,b.y+py*o,BA,BB);s+=line(x1,y1,x2,y2);}
    return s;
  }
  // double bond: decide side
  let side=null;
  if(bd.dpos!=null)side=bd.dpos;
  else{
    const ring=ringOf(bd);
    if(ring&&ring.length>2){let cx=0,cy=0;ring.forEach(id=>{const t=A(id);cx+=t.x;cy+=t.y;});cx/=ring.length;cy/=ring.length;side=Math.sign(px*(cx-a.x)+py*(cy-a.y))||1;}
    else{
      const na=nbrs(a.id).filter(n=>n.id!==b.id),nb2=nbrs(b.id).filter(n=>n.id!==a.id);
      if((!na.length&&!nb2.length)||(la&&!na.length)||(lb&&!nb2.length))side=0;
      else{let sc=0;na.forEach(n=>sc+=Math.sign(px*(n.x-a.x)+py*(n.y-a.y)));nb2.forEach(n=>sc+=Math.sign(px*(n.x-b.x)+py*(n.y-b.y)));side=Math.sign(sc);}
    }
  }
  if(side===0){
    for(const o of [-DBS/2,DBS/2]){const [x1,y1,x2,y2]=trim(a.x+px*o,a.y+py*o,b.x+px*o,b.y+py*o,BA,BB);s+=line(x1,y1,x2,y2);}
  }else{
    let [x1,y1,x2,y2]=trim(a.x,a.y,b.x,b.y,BA,BB);s+=line(x1,y1,x2,y2);
    const o=DBS*side,sh=len*0.12;
    const sa=BA?0:sh,sb=BB?0:sh;
    let [u1,v1,u2,v2]=trim(a.x+px*o+ux*sa,a.y+py*o+uy*sa,b.x+px*o-ux*sb,b.y+py*o-uy*sb,BA,BB);
    s+=line(u1,v1,u2,v2);
  }
  return s;
}
function labelSVG(a){
  const l=LAY.get(a.id);
  if(!l){ // hidden carbon with charge
    if(a.charge){const t=chargeStr(a.charge);return `<text x="${r2(a.x+5)}" y="${r2(a.y-6)}" font-family="${FONT}" font-size="${SS}" fill="${INK}">${esc(t)}</text>`;}
    return '';
  }
  return tokSVG(l.toks,a.y+7,atomColor(a),FS);
}
function arrowHead(x,y,ux,uy,half){
  const px=-uy,py=ux,sz=11,w=4.2,bx=x-ux*sz,by=y-uy*sz,nx=x-ux*sz*0.72,ny=y-uy*sz*0.72;
  if(half)return `<polygon points="${r2(x)},${r2(y)} ${r2(bx+px*w*1.5*half)},${r2(by+py*w*1.5*half)} ${r2(nx)},${r2(ny)}" fill="${INK}" stroke="${INK}" stroke-width="0.8" stroke-linejoin="round"/>`;
  return `<polygon points="${r2(x)},${r2(y)} ${r2(bx+px*w)},${r2(by+py*w)} ${r2(nx)},${r2(ny)} ${r2(bx-px*w)},${r2(by-py*w)}" fill="${INK}"/>`;
}
function curveCtrl(r){const mx=(r.x1+r.x2)/2,my=(r.y1+r.y2)/2,dx=r.x2-r.x1,dy=r.y2-r.y1,len=Math.hypot(dx,dy)||1;const b=(r.bend||-1)*0.42;return [mx+(-dy/len)*len*b,my+(dx/len)*len*b];}
function arrowSVG(r){
  const dx=r.x2-r.x1,dy=r.y2-r.y1,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,px=-uy,py=ux;let s='';
  switch(r.type){
    case 'eq':{const o=3.6;

function computeLayouts(){

function docBBox(){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  const inc=(a,b,c,d)=>{x1=Math.min(x1,a);y1=Math.min(y1,b);x2=Math.max(x2,c);y2=Math.max(y2,d);};
  for(const a of D.atoms){const l=LAY.get(a.id);if(l)inc(l.box.x1,l.box.y1,l.box.x2,l.box.y2);else inc(a.x-3,a.y-(a.charge?16:3),a.x+(a.charge?16:3),a.y+3);}
  for(const r of D.arrows){inc(Math.min(r.x1,r.x2)-6,Math.min(r.y1,r.y2)-6,Math.max(r.x1,r.x2)+6,Math.max(r.y1,r.y2)+6);if(r.type==='curved'||r.type==='fish'){const [cx,cy]=curveCtrl(r);const mx=(r.x1+2*cx+r.x2)/4,my=(r.y1+2*cy+r.y2)/4;inc(mx-4,my-4,mx+4,my+4);}}
  for(const t of D.texts){const l=TL.get(t.id);if(l)inc(l.box.x1,l.box.y1,l.box.x2,l.box.y2);}
  for(const k of D.brackets){let ex=k.sup||k.sub?tw(k.sup||k.sub||'',15)+6:0;inc(k.x1-6,k.y1-8,k.x2+ex,k.y2+8);}
  if(x1===Infinity)return null;
  return {x1,y1,x2,y2,w:x2-x1,h:y2-y1};
}

function hit(p,excludeAtom){
  const tol=Math.max(7,10/view.s);
  let best=null,bd=Infinity;
  for(const a of D.atoms){if(a.id===excludeAtom)continue;let d=Math.hypot(a.x-p.x,a.y-p.y);const l=LAY.get(a.id);
    if(l&&p.x>=l.abox.x1-2&&p.x<=l.abox.x2+2&&p.y>=l.abox.y1&&p.y<=l.abox.y2)d=Math.min(d,2);
    if(d<tol&&d<bd){bd=d;best={kind:'atom',obj:a};}}
  if(best)return best;
  for(const t of D.texts){const l=TL.get(t.id);if(l&&p.x>=l.box.x1-3&&p.x<=l.box.x2+3&&p.y>=l.box.y1-3&&p.y<=l.box.y2+3)return {kind:'text',obj:t};}
  const btol=Math.max(5,7/view.s);
  for(const b of D.bonds){const a1=A(b.a),a2=A(b.b);if(!a1||!a2)continue;const d=segDist(p.x,p.y,a1.x,a1.y,a2.x,a2.y);if(d<btol&&d<bd){bd=d;best={kind:'bond',obj:b};}}
  if(best)return best;
  for(const r of D.arrows){let d;if(r.type==='curved'||r.type==='fish'){const [cx,cy]=curveCtrl(r);d=Infinity;let px0=r.x1,py0=r.y1;for(let i=1;i<=16;i++){const t=i/16,x=(1-t)*(1-t)*r.x1+2*(1-t)*t*cx+t*t*r.x2,y=(1-t)*(1-t)*r.y1+2*(1-t)*t*cy+t*t*r.y2;d=Math.min(d,segDist(p.x,p.y,px0,py0,x,y));px0=x;py0=y;}}else d=segDist(p.x,p.y,r.x1,r.y1,r.x2,r.y2);
    if(d<Math.max(7,9/view.s)&&d<bd){bd=d;best={kind:'arrow',obj:r};}}
  if(best)return best;
  for(const k of D.brackets){const inY=p.y>=k.y1-4&&p.y<=k.y2+4;if(inY&&(Math.abs(p.x-k.x1)<7||Math.abs(p.x-k.x2)<7))return {kind:'bracket',obj:k};
    if(k.sup&&p.x>=k.x2&&p.x<=k.x2+tw(k.sup,15)+6&&p.y>=k.y1-8&&p.y<=k.y1+12)return {kind:'bracket',obj:k};}
  return null;
}
function nearestAtom(p,r,ex){let best=null,bd=r;for(const a of D.atoms){if(a.id===ex)continue;const d=Math.hypot(a.x-p.x,a.y-p.y);if(d<bd){bd=d;best=a;}}return best;}

/* ================= construction ================= */
function bestAngle(a){
  const nb=nbrs(a.id);
  const crowd=ang=>{const x=a.x+L*Math.cos(ang),y=a.y+L*Math.sin(ang);let m=Infinity;for(const o of D.atoms){if(o.id===a.id)continue;m=Math.min(m,Math.hypot(o.x-x,o.y-y));}return m;};
  if(!nb.length)return -P6;
  if(nb.length===1){
    const n=nb[0],th=Math.atan2(n.y-a.y,n.x-a.x),bd=bondBetween(a.id,n.id);
    if(bd&&bd.order===3)return th+Math.PI;
    const cs=[th+2*Math.PI/3,th-2*Math.PI/3];
    let best=cs[0],bs=-Infinity;
    for(const c of cs){const cr=crowd(c);let sc=(cr<L*0.6?-1000:0)+Math.min(cr,L*2)-Math.abs(Math.sin(c))*3;if(sc>bs){bs=sc;best=c;}}
    return best;
  }
  const angs=nb.map(n=>Math.atan2(n.y-a.y,n.x-a.x)).sort((x,y)=>x-y);
  let bg=-1,bm=0;
  for(let i=0;i<angs.length;i++){const a1=angs[i],a2=i+1<angs.length?angs[i+1]:angs[0]+2*Math.PI;const g=a2-a1;if(g>bg+1e-6){bg=g;bm=a1+g/2;}}
  return bm;
}
function newBondFrom(a,order,style,el){
  const ang=bestAngle(a);const x=a.x+L*Math.cos(ang),y=a.y+L*Math.sin(ang);
  const n=nearestAtom({x,y},7,a.id);const b=n||addAtom(x,y,el||'C');
  if(!bondBetween(a.id,b.id))addBond(a,b,order,style);return b;
}
function applyBondTool(bd,t){
  if(t.style==='plain'){
    if(t.order===1){if(bd.style!=='plain'){bd.style='plain';bd.order=1;}else bd.order=bd.order%3+1;delete bd.dpos;}
    else if(t.order===2&&bd.order===2){const cyc=[undefined,0,1,-1];const i=cyc.indexOf(bd.dpos);const nx=cyc[(i+1)%cyc.length];if(nx===undefined)delete bd.dpos;else bd.dpos=nx;}
    else{bd.order=t.order;bd.style='plain';delete bd.dpos;}
  }else{
    if(bd.style===t.style&&['wedge','hash','coord'].includes(t.style)){const x=bd.a;bd.a=bd.b;bd.b=x;}
    else{bd.style=t.style;bd.order=1;delete bd.dpos;}
  }
}
function snapEnd(sp,p,exId,free){
  const near=nearestAtom(p,12,exId);if(near)return {x:near.x,y:near.y,atom:near};
  let ang=Math.atan2(p.y-sp.y,p.x-sp.x);if(!free)ang=Math.round(ang/(Math.PI/12))*(Math.PI/12);
  const e={x:sp.x+L*Math.cos(ang),y:sp.y+L*Math.sin(ang)};
  const n2=nearestAtom(e,8,exId);if(n2)return {x:n2.x,y:n2.y,atom:n2};
  return e;
}
function chainPts(sp,p,startAtom){
  let ang=Math.atan2(p.y-sp.y,p.x-sp.x);ang=Math.round(ang/P6)*P6;
  const d=Math.hypot(p.x-sp.x,p.y-sp.y),step=L*Math.cos(P6),n=Math.max(1,Math.round(d/step));
  const ux=Math.cos(ang),uy=Math.sin(ang),px=-uy,py=ux;
  let side=-1;
  const mk=sd=>{const pts=[];for(let k=1;k<=n;k++)pts.push({x:sp.x+ux*step*k+px*sd*(k%2?L*0.5:0),y:sp.y+uy*step*k+py*sd*(k%2?L*0.5:0)});return pts;};
  if(startAtom){const nb=nbrs(startAtom.id);if(nb.length){const t1=mk(1)[0],t2=mk(-1)[0];const sc=t=>Math.min(...nb.map(q=>Math.hypot(q.x-t.x,q.y-t.y)));side=sc(t1)>sc(t2)?1:-1;}}
  else if(Math.abs(uy)>0.9)side=1;
  return mk(side);
}
function ringVerts(n,h,p){
  const R=L/(2*Math.sin(Math.PI/n)),ap=L/(2*Math.tan(Math.PI/n));
  if(h&&h.kind==='bond'){
    const a=A(h.obj.a),b=A(h.obj.b);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,px=-dy/len,py=dx/len;
    let bestS=1,bestSc=Infinity;
    for(const s of [1,-1]){const cx=mx+px*s*ap,cy=my+py*s*ap;let sc=0;for(const o of D.atoms){if(o===a||o===b)continue;const d=Math.hypot(o.x-cx,o.y-cy);if(d<R*1.15)sc+=1;}
      // prefer side opposite to existing neighbours
      for(const o of [...nbrs(a.id),...nbrs(b.id)]){if(o===a||o===b)continue;sc+=Math.sign(px*s*(o.x-mx)+py*s*(o.y-my))>0?0.5:0;}
      if(p)sc-=0.01*Math.sign(px*s*(p.x-mx)+py*s*(p.y-my));
      if(sc<bestSc){bestSc=sc;bestS=s;}}
    const cx=mx+px*bestS*ap,cy=my+py*bestS*ap;
    const aa=Math.atan2(a.y-cy,a.x-cx),ab=Math.atan2(b.y-cy,b.x-cx);let df=ab-aa;while(df>Math.PI)df-=2*Math.PI;while(df<-Math.PI)df+=2*Math.PI;const dir=Math.sign(df);
    const v=[];for(let k=0;k<n;k++){const ang=aa+k*dir*2*Math.PI/n;v.push({x:cx+R*Math.cos(ang),y:cy+R*Math.sin(ang)});}
    v[0]={x:a.x,y:a.y,atom:a};v[1]={x:b.x,y:b.y,atom:b};return v;
  }
  if(h&&h.kind==='atom'){
    const a=h.obj;const phi=nbrs(a.id).length?bestAngle(a):-Math.PI/2;const cx=a.x+R*Math.cos(phi),cy=a.y+R*Math.sin(phi);
    const v=[];for(let k=0;k<n;k++){const ang=phi+Math.PI+k*2*Math.PI/n;v.push({x:cx+R*Math.cos(ang),y:cy+R*Math.sin(ang)});}
    v[0]={x:a.x,y:a.y,atom:a};return v;
  }
  const v=[];for(let k=0;k<n;k++){const ang=-Math.PI/2+k*2*Math.PI/n;v.push({x:p.x+R*Math.cos(ang),y:p.y+R*Math.sin(ang)});}return v;
}
function placeRing(n,arom,h,p){
  if(h&&!['atom','bond'].includes(h.kind))h=null;
  const vs=ringVerts(n,h,p);
  const atoms=vs.map(v=>v.atom||nearestAtom(v,7)||addAtom(v.x,v.y,'C'));
  const edges=[];for(let k=0;k<n;k++){const a=atoms[k],b=atoms[(k+1)%n];edges.push(addBond(a,b,1,'plain'));}
  if(arom){
    let best=0,bs=-Infinity;
    for(const ph of [0,1]){let sc=0;for(let k=ph;k<n;k+=2){const e=edges[k];if(!e)continue;if(e.order===2)sc+=2;
      for(const id of [e.a,e.b]){if(bondsOf(id).some(o=>o!==e&&o.order===2&&!edges.includes(o)))sc-=5;}}
      if(sc>bs){bs=sc;best=ph;}}
    for(let k=best;k<n;k+=2){const e=edges[k];if(!e)continue;if([e.a,e.b].some(id=>bondsOf(id).some(o=>o!==e&&o.order>=2)))continue;e.order=2;e.style='plain';}
  }
  return true;
}
function addComplex(cfg,cx,cy){
  const R=L*1.3,d=Math.PI/180;
  const GEO={linear:[[0,'p'],[180,'p']],trig:[[-90,'p'],[30,'p'],[150,'p']],tetra:[[-90,'p'],[150,'p'],[40,'w'],[-10,'h']],
    sq:[[-90,'p'],[90,'p'],[180,'p'],[0,'p']],tbp:[[-90,'p'],[90,'p'],[180,'p'],[30,'w'],[-30,'h']],
    sqpy:[[-90,'p'],[150,'w'],[30,'w'],[-150,'h'],[-30,'h']],oct:[[-90,'p'],[90,'p'],[150,'w'],[30,'w'],[-150,'h'],[-30,'h']]};

  for(const a of made){const l=LAY.get(a.id);const b=l?l.box:{x1:a.x-4,x2:a.x+4,y1:a.y-4,y2:a.y+4};x1=Math.min(x1,b.x1);y1=Math.min(y1,b.y1);x2=Math.max(x2,b.x2);y2=Math.max(y2,b.y2);}
  const ids=made.map(a=>'a:'+a.id);
  if(cfg.brackets){const k={id:nid(),x1:x1-7,y1:y1-6,x2:x2+7,y2:y2+6,shape:'square',sup:cfg.charge?chargeStr(cfg.charge).replace(MSIGN,'-'):''};D.brackets.push(k);ids.push('k:'+k.id);

function normLig(s){s=s.trim();return ({H2O:'OH2',H3N:'NH3',OC:'CO'})[s]||s;}
function setAtomText(a,v){

function endGesture(e,cancel){
  if(!G||e.pointerId!==G.id)return;const g=G;G=null;cv.classList.remove('panning');
  if(g.pan||cancel){renderOverlay();return;}
  const p=W(e);let changed=false;const k=tool.kind;
  switch(k){
    case 'select':
      if(g.handle)changed=true;
      else if(g.move&&g.moved&&!g.nomove){tryMerge();changed=true;}
      else if(g.marq&&g.moved)marquee(g.p0,p,g.shift);
      else if(g.marq&&!g.moved)sel.clear();
      break;
    case 'erase':changed=!!g.erased;break;
    case 'bond':case 'atom':changed=bondToolUp(g,p);break;
    case 'chain':changed=chainUp(g,p);break;
    case 'ring':changed=placeRing(tool.n,tool.arom,g.h,g.moved?g.p0:p);break;
    case 'charge':if(g.h&&g.h.kind==='atom'){const a=g.h.obj;a.charge=Math.max(-4,Math.min(4,(a.charge||0)+tool.d));changed=true;}break;
    case 'label':if(g.h&&g.h.kind==='atom')openEditor('atom',g.h.obj,false);else{const a=addAtom(p.x,p.y,'C');render();openEditor('atom',a,true);}render();return;
    case 'arrow':
      if(!g.moved&&g.h&&g.h.kind==='arrow'&&(g.h.obj.type==='curved'||g.h.obj.type==='fish')){g.h.obj.bend=-(g.h.obj.bend||-1);changed=true;break;}
      changed=arrowUp(g,p);break;
    case 'text':
      if(g.h&&g.h.kind==='text'){openEditor('text',g.h.obj,false);return;}
      {const t={id:nid(),x:p.x,y:p.y+6,text:'',formula:S_.formula,size:18};D.texts.push(t);render();openEditor('text',t,true);}return;
    case 'plus':D.texts.push({id:nid(),x:p.x-tw('+',22)/2,y:p.y+7,text:'+',formula:false,size:22});changed=true;break;
    case 'bracket':
      if(!g.moved){if(g.h&&g.h.kind==='bracket')openEditor('bracket',g.h.obj,false);break;}
      {const x1=Math.min(g.p0.x,p.x),x2=Math.max(g.p0.x,p.x),y1=Math.min(g.p0.y,p.y),y2=Math.max(g.p0.y,p.y);
       if(x2-x1>12&&y2-y1>12){const kk={id:nid(),x1,y1,x2,y2,shape:tool.shape,sup:''};D.brackets.push(kk);render();save();openEditor('bracket',kk,true);return;}}
      break;
  }
  render();if(changed)save();
}

function sameHit(a,b){return (!a&&!b)||(a&&b&&a.kind===b.kind&&a.obj===b.obj);}

function tryMerge(){
  const ids=[...selAtomIds()];if(ids.length!==1)return;const a=A(ids[0]);const t=nearestAtom(a,9,a.id);if(!t)return;
  for(const b of bondsOf(a.id)){const other=b.a===a.id?b.b:b.a;if(other===t.id){removeBond(b);continue;}if(bondBetween(t.id,other)){removeBond(b);continue;}if(b.a===a.id)b.a=t.id;else b.b=t.id;}
  if(a.label&&!t.label){t.label=a.label;}if(a.el!=='C'&&t.el==='C'&&!t.label)t.el=a.el;
  removeAtom(a.id);sel.clear();sel.add('a:'+t.id);
}
function marquee(p0,p,add){
  const x1=Math.min(p0.x,p.x),x2=Math.max(p0.x,p.x),y1=Math.min(p0.y,p.y),y2=Math.max(p0.y,p.y);const inR=(x,y)=>x>=x1&&x<=x2&&y>=y1&&y<=y2;
  if(!add)sel.clear();
  D.atoms.forEach(a=>{if(inR(a.x,a.y))sel.add('a:'+a.id);});
  D.arrows.forEach(r=>{if(inR(r.x1,r.y1)&&inR(r.x2,r.y2))sel.add('r:'+r.id);});
  D.texts.forEach(t=>{const l=TL.get(t.id);if(l&&inR((l.box.x1+l.box.x2)/2,(l.box.y1+l.box.y2)/2))sel.add('t:'+t.id);});
  D.brackets.forEach(k=>{if(inR(k.x1,k.y1)&&inR(k.x2,k.y2))sel.add('k:'+k.id);});

function eraseHit(h){
  if(!h)return false;

  else if(h.kind==='bond'){removeBond(h.obj);cleanupOrphans([h.obj.a,h.obj.b]);}
  else if(h.kind==='arrow')D.arrows=D.arrows.filter(x=>x!==h.obj);
  else if(h.kind==='text')D.texts=D.texts.filter(x=>x!==h.obj);
  else if(h.kind==='bracket')D.brackets=D.brackets.filter(x=>x!==h.obj);
  hover=null;return true;
}
function bondToolUp(g,p){
  const isA=tool.kind==='atom',el=isA?tool.el:'C',order=isA?1:tool.order,style=isA?'plain':tool.style,h=g.h;
  if(!g.moved){
    if(h&&h.kind==='atom'){const a=h.obj;
      if(isA){if(a.el!==el||a.label){a.el=el;delete a.label;}else newBondFrom(a,1,'plain',el);return true;}
      newBondFrom(a,order,style,'C');return true;}
    if(h&&h.kind==='bond'){if(isA)return false;applyBondTool(h.obj,tool);return true;}
    if(!h){if(isA){addAtom(p.x,p.y,el);return true;}const a=addAtom(p.x,p.y);const b=addAtom(p.x+L*Math.cos(-P6),p.y+L*Math.sin(-P6));addBond(a,b,order,style);return true;}
    return false;
  }
  const s0=h&&h.kind==='atom'?h.obj:null;const sp=s0?{x:s0.x,y:s0.y}:g.p0;const e=snapEnd(sp,p,s0&&s0.id,g.shift);
  const sa=s0||(nearestAtom(sp,7)||addAtom(sp.x,sp.y,'C'));const ea=e.atom||addAtom(e.x,e.y,el);
  if(sa===ea)return true;
  const ex=bondBetween(sa.id,ea.id);if(ex){if(!isA)applyBondTool(ex,tool);}else addBond(sa,ea,order,style);
  return true;
}
function chainUp(g,p){
  const s0=g.h&&g.h.kind==='atom'?g.h.obj:null;
  if(!g.moved){if(s0){newBondFrom(s0,1,'plain','C');return true;}const a=addAtom(p.x,p.y);const b=addAtom(p.x+L*Math.cos(-P6),p.y+L*Math.sin(-P6));addBond(a,b);return true;}
  const sp=s0||g.p0;const pts=chainPts(sp,p,s0);let prev=s0||addAtom(sp.x,sp.y,'C');
  for(const q of pts){const n=nearestAtom(q,8)||addAtom(q.x,q.y,'C');addBond(prev,n,1,'plain');prev=n;}
  return true;
}
function arrowUp(g,p){
  const x1=g.p0.x,y1=g.p0.y;let x2,y2;
  if(!g.moved||Math.hypot(p.x-x1,p.y-y1)<14){const len=(tool.type==='curved'||tool.type==='fish')?L*1.6:L*2.6;x2=x1+len;y2=y1;}
  else({x2,y2}=snapArrow(g.p0,p,g.shift));
  D.arrows.push({id:nid(),x1,y1,x2,y2,type:tool.type,bend:-1});return true;
}

const HOVKEYS={c:'C',n:'N',o:'O',s:'S',p:'P',f:'F',h:'H',i:'I',b:'B',l:'Cl',r:'Br',k:'K',m:'Mg'};
function typing(e){const t=e.target;return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);}
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return;}
  if(typing(e))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key;
  if(k===' '){spaceDown=true;e.preventDefault();return;}
  if(mod){
    const kl=k.toLowerCase();
    if(kl==='z'&&!e.shiftKey){e.preventDefault();undo();}
    else if(kl==='y'||(kl==='z'&&e.shiftKey)){e.preventDefault();redo();}
    else if(kl==='a'){e.preventDefault();D.atoms.forEach(a=>sel.add('a:'+a.id));D.arrows.forEach(r=>sel.add('r:'+r.id));D.texts.forEach(t=>sel.add('t:'+t.id));D.brackets.forEach(b=>sel.add('k:'+b.id));render();}
    else if(kl==='c'){if(sel.size){e.preventDefault();copySel();}}
    else if(kl==='x'){if(sel.size){e.preventDefault();copySel();delSel();}}
    else if(kl==='d'){e.preventDefault();dupSel();}
    else if(kl==='s'){e.preventDefault();doSave();}
    else if(kl==='0'){e.preventDefault();fit();}
    return;
  }
  if(k==='Escape'){if(G){G=null;renderOverlay();}sel.clear();setTool('select');render();return;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();if(sel.size)delSel();else if(hover&&eraseHit(hover)){render();save();}return;}
  if(hover&&hover.kind==='atom'){
    const a=hover.obj;
    if(HOVKEYS[k]&&!e.altKey){a.el=HOVKEYS[k];delete a.label;render();save();return;}
    if(k==='+'||k==='='){a.charge=Math.min(4,(a.charge||0)+1);render();save();return;}
    if(k==='-'){a.charge=Math.max(-4,(a.charge||0)-1);render();save();return;}
    if(k==='Enter'){openEditor('atom',a,false);return;}
  }
  if(hover&&hover.kind==='bond'){
    const b=hover.obj;
    if(['1','2','3'].includes(k)){b.order=+k;b.style='plain';delete b.dpos;render();save();return;}
    if(k==='w'){applyBondTool(b,{style:'wedge'});render();save();return;}
    if(k==='d'){applyBondTool(b,{style:'hash'});render();save();return;}
  }
  const map={v:'select',e:'erase',t:'text',b:'rb','1':'b1','2':'b2','3':'b3',c:'chain'};
  if(map[k]&&!hover){setTool(map[k]);}
});

function pasteFrag(f,dx,dy){

  (f.arrows||[]).forEach(r=>{const n={...r,id:nid(),x1:r.x1+dx,y1:r.y1+dy,x2:r.x2+dx,y2:r.y2+dy};D.arrows.push(n);sel.add('r:'+n.id);});

function dupSel(){if(!sel.size)return;pasteFrag(selFragment(),L*0.75,L*0.75);}
function delSel(){

function selCenter(){let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;const inc=(x,y)=>{x1=Math.min(x1,x);x2=Math.max(x2,x);y1=Math.min(y1,y);y2=Math.max(y2,y);};
  selAtomIds().forEach(id=>{const a=A(id);inc(a.x,a.y);});selObjs('r').forEach(r=>{inc(r.x1,r.y1);inc(r.x2,r.y2);});selObjs('t').forEach(t=>{const l=TL.get(t.id);inc(l.box.x1,l.box.y1);inc(l.box.x2,l.box.y2);});selObjs('k').forEach(k=>{inc(k.x1,k.y1);inc(k.x2,k.y2);});
  return {x:(x1+x2)/2,y:(y1+y2)/2};}
function transformSel(fn,kind){
  if(!sel.size)return;const c=selCenter();
  selAtomIds().forEach(id=>{const a=A(id);[a.x,a.y]=fn(a.x,a.y,c);});
  selObjs('r').forEach(r=>{[r.x1,r.y1]=fn(r.x1,r.y1,c);[r.x2,r.y2]=fn(r.x2,r.y2,c);if(kind==='flip')r.bend=-(r.bend||-1);});
  selObjs('t').forEach(t=>{const l=TL.get(t.id);const w=l.box.x2-l.box.x1-4;const cx=t.x+w/2,cy=t.y-l.size*0.3;const [nx,ny]=fn(cx,cy,c);t.x=nx-w/2;t.y=ny+l.size*0.3;});
  selObjs('k').forEach(k=>{const [ax,ay]=fn(k.x1,k.y1,c),[bx,by]=fn(k.x2,k.y2,c);if(kind==='rot'){const cx=(ax+bx)/2,cy=(ay+by)/2,w=(k.x2-k.x1)/2,h=(k.y2-k.y1)/2;k.x1=cx-w;k.x2=cx+w;k.y1=cy-h;k.y2=cy+h;}else{k.x1=Math.min(ax,bx);k.x2=Math.max(ax,bx);k.y1=Math.min(ay,by);k.y2=Math.max(ay,by);}});

const rot=deg=>{const t=deg*Math.PI/180,cs=Math.cos(t),sn=Math.sin(t);return (x,y,c)=>[c.x+(x-c.x)*cs-(y-c.y)*sn,c.y+(x-c.x)*sn+(y-c.y)*cs];};

function exportSVG(opt){
  opt=opt||{};computeLayouts();const bb=docBBox();if(!bb)return null;const m=8;
  const x=bb.x1-m,y=bb.y1-m,w=bb.w+2*m,h=bb.h+2*m,sc=opt.scale||1;
  const body=docSVG();
  return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${r2(w*sc)}" height="${r2(h*sc)}" viewBox="${r2(x)} ${r2(y)} ${r2(w)} ${r2(h)}">${opt.bg?`<rect x="${r2(x)}" y="${r2(y)}" width="${r2(w)}" height="${r2(h)}" fill="#ffffff"/>`:''}${body}</svg>`,w,h};
}
function svgToPng(svg,W2,H2){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round(W2);c.height=Math.round(H2);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);try{res(c.toDataURL('image/png'));}catch(e){rej(e);}};img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function b64ToBytes(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function bytesToB64(u){let s='';const ch=0x8000;for(let i=0;i<u.length;i+=ch)s+=String.fromCharCode.apply(null,u.subarray(i,i+ch));return btoa(s);}
function pngWithText(dataUrl,kw,text){
  const u=b64ToBytes(dataUrl.split(',')[1]);const data=new TextEncoder().encode(kw+'\0'+text);
  const ch=new Uint8Array(12+data.length);const dv=new DataView(ch.buffer);dv.setUint32(0,data.length);ch.set([116,69,88,116],4);ch.set(data,8);dv.setUint32(8+data.length,crc32(ch.subarray(4,8+data.length)));
  const out=new Uint8Array(u.length+ch.length);out.set(u.subarray(0,33));out.set(ch,33);out.set(u.subarray(33),33+ch.length);return 'data:image/png;base64,'+bytesToB64(out);
}
function pngReadText(u,kw){
  const dv=new DataView(u.buffer,u.byteOffset,u.byteLength);let i=8;
  while(i+8<=u.length){const len=dv.getUint32(i);const type=String.fromCharCode(u[i+4],u[i+5],u[i+6],u[i+7]);
    if(type==='tEXt'){const d=u.subarray(i+8,i+8+len);const z=d.indexOf(0);const k=new TextDecoder().decode(d.subarray(0,z));if(k===kw)return new TextDecoder().decode(d.subarray(z+1));}
    if(type==='IEND')break;i+=12+len;}
  return null;
}
function docPayload(){const c=JSON.parse(JSON.stringify(D));const rd=v=>Math.round(v*10)/10;c.atoms.forEach(a=>{a.x=rd(a.x);a.y=rd(a.y);});c.arrows.forEach(r=>{['x1','y1','x2','y2'].forEach(k=>r[k]=rd(r[k]));});c.texts.forEach(t=>{t.x=rd(t.x);t.y=rd(t.y);});c.brackets.forEach(k=>{['x1','y1','x2','y2'].forEach(q=>k[q]=rd(k[q]));});return JSON.stringify(c);}
async function makePng(scale,bg){const e=exportSVG({scale,bg});if(!e)return null;const url=await svgToPng(e.svg,e.w*scale,e.h*scale);return {url:pngWithText(url,'marsam',encodeURIComponent(docPayload())),w:e.w,h:e.h};}
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});}catch(e){}
function dataUrlToBlob(url){const i=url.indexOf(',');const meta=url.slice(5,i),body=url.slice(i+1);const type=meta.split(';')[0];
  if(/;base64/.test(meta))return new Blob([b64ToBytes(body)],{type});return new Blob([decodeURIComponent(body)],{type});}
async function download(url,name){
  if(DL){try{await DL.save({filename:name,data:dataUrlToBlob(url)});return;}catch(e){const c=e&&e.code;if(c==='declined')return;if(c&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){toast('تعذّر حفظ الملف');return;}}}
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100);}
function loadDoc(obj){
  const d=Object.assign(emptyDoc(),obj);d.nid=Math.max(d.nid||1,1+Math.max(0,...d.atoms.map(a=>a.id),...d.bonds.map(b=>b.id),...d.arrows.map(r=>r.id),...d.texts.map(t=>t.id),...d.brackets.map(k=>k.id)));
  D=d;reindex();sel.clear();render();fit();save();
}
function readPngFile(file,asFrag){
  const fr=new FileReader();fr.onload=()=>{const u=new Uint8Array(fr.result);const t=pngReadText(u,'marsam');if(!t){toast('هذه الصورة لا تحتوي على رسم من مرسم');return;}
    const obj=JSON.parse(decodeURIComponent(t));if(asFrag){const r=cv.getBoundingClientRect();computeLayouts();pasteFrag(obj,0,0);}else loadDoc(obj);};fr.readAsArrayBuffer(file);
}

function ptClass(z){
  if([1,6,7,8,15,16,34].includes(z))return 'k-nm';if([2,10,18,36,54,86,118].includes(z))return 'k-ng';if([9,17,35,53,85,117].includes(z))return 'k-hl';
  if([3,11,19,37,55,87].includes(z))return 'k-am';if([4,12,20,38,56,88].includes(z))return 'k-ae';if(z>=57&&z<=71)return 'k-ln';if(z>=89&&z<=103)return 'k-ln';
  if([5,14,32,33,51,52].includes(z))return 'k-md';if((z>=21&&z<=30)||(z>=39&&z<=48)||(z>=72&&z<=80)||(z>=104&&z<=112))return 'k-tm';return '';
}
function ptPos(z){
  if(z===1)return [1,1];if(z===2)return [1,18];
  if(z<=10)return [2,z<=4?z-2:z+8];if(z<=18)return [3,z<=12?z-10:z];
  if(z<=36)return [4,z-18];if(z<=54)return [5,z-36];
  if(z<=56)return [6,z-54];if(z<=71)return [9,z-54];if(z<=86)return [6,z-68];
  if(z<=88)return [7,z-86];if(z<=103)return [10,z-86];return [7,z-100];
}

const GEOS=[['oct','ثماني الأوجه',6],['sq','مربع مستوٍ',4],['tetra','رباعي الأوجه',4],['tbp','ثنائي الهرم المثلثي',5],['sqpy','هرم مربع القاعدة',5],['trig','مثلث مستوٍ',3],['linear','خطي',2]];
function geoIcon(g){const m={oct:[[-90,'p'],[90,'p'],[150,'w'],[30,'w'],[-150,'h'],[-30,'h']],sq:[[-90,'p'],[90,'p'],[180,'p'],[0,'p']],tetra:[[-90,'p'],[150,'p'],[40,'w'],[-10,'h']],tbp:[[-90,'p'],[90,'p'],[180,'p'],[30,'w'],[-30,'h']],sqpy:[[-90,'p'],[150,'w'],[30,'w'],[-150,'h'],[-30,'h']],trig:[[-90,'p'],[30,'p'],[150,'p']],linear:[[0,'p'],[180,'p']]}[g];
  let s='';for(const [a,st] of m){const x=32+22*Math.cos(a*Math.PI/180),y=26+22*Math.sin(a*Math.PI/180);s+=st==='w'?`<polygon points="32,26 ${x+2.5*Math.sin(a*Math.PI/180)},${y-2.5*Math.cos(a*Math.PI/180)} ${x-2.5*Math.sin(a*Math.PI/180)},${y+2.5*Math.cos(a*Math.PI/180)}" fill="currentColor"/>`:`<line x1="32" y1="26" x2="${x}" y2="${y}" stroke="currentColor" stroke-width="1.6" ${st==='h'?'stroke-dasharray="2 2"':''}/>`;s+=`<circle cx="${x}" cy="${y}" r="2.6" fill="currentColor"/>`;}
  return `<svg width="64" height="52" viewBox="0 0 64 52">${s}<circle cx="32" cy="26" r="4.5" fill="currentColor"/></svg>`;}
let CPLX={geo:'oct',metal:'Co',ox:3,ligs:'NH3',arrows:false,brackets:true,counter:'Cl3'};
function cplxCharge(c){const ls=c.ligs.split(/[,،]/).map(s=>s.trim()).filter(Boolean);const n=GEOS.find(g=>g[0]===c.geo)[2];let q=+c.ox||0;for(let i=0;i<n;i++){const l=normLig(ls[Math.min(i,ls.length-1)]||'');q+=LIGQ[l]??(LIGQ[l.replace(/^O/,'')]??0);}return q;}
function cplxName(c){const ls=c.ligs.split(/[,،]/).map(s=>s.trim()).filter(Boolean);const n=GEOS.find(g=>g[0]===c.geo)[2];const cnt=new Map();for(let i=0;i<n;i++){const l=ls[Math.min(i,ls.length-1)]||'L';cnt.set(l,(cnt.get(l)||0)+1);}
  let s='['+(c.metal||'M');cnt.forEach((k,l)=>{const simple=/^[A-Z][a-z]?$/.test(l);s+=(simple?l:'('+l+')')+(k>1?k:'');});s+=']';const q=cplxCharge(c);return s+(q?'^'+chargeStr(q):'')+(c.brackets&&c.counter?c.counter:'');}

   <kbd>V  E  T  B  C</kbd><span>أدوات: تحديد، ممحاة، نص، بنزين، سلسلة</span>
   <kbd>Shift</kbd><span>أثناء السحب: زاوية حرة بدل الزوايا الثابتة</span>
   <kbd>Ctrl+Z / Ctrl+Y</kbd><span>تراجع / إعادة</span>
   <kbd>Ctrl+C / Ctrl+V / Ctrl+D</kbd><span>نسخ / لصق / تكرار المحدد</span>
   <kbd>Delete</kbd><span>حذف المحدد أو ما تحت المؤشر</span>
   <kbd>Ctrl + عجلة</kbd><span>تكبير وتصغير؛ العجلة وحدها أو المسافة + سحب لتحريك اللوحة</span>
  </div>
  <h3 style="margin-top:18px">الربط مع Word</h3>
  <p class="note">تعمل الإضافة داخل Word على ويندوز (Office 2016 فما فوق أو Microsoft 365) كلوحة جانبية بزر «فتح المرسم» في تبويب الصفحة الرئيسية. يُدرج الرسم كصورة عالية الدقة تحمل بنيتها داخلها: حدّد الصورة في المستند واضغط «تحرير الرسم المحدد» لتعديلها ثم «إدراج في Word» لاستبدالها.</p>
  ${hosted?`<p class="note">هذه النسخة مستضافة على <span dir="ltr">${esc(base)}</span>. نزّل ملف الإضافة المضبوط على هذا العنوان، ثم شغّل ملف التثبيت بجانبه.</p><div class="acts" style="justify-content:flex-start"><button class="btn primary" id="h-man">تنزيل ملف الإضافة manifest.xml</button></div>`:`<p class="note">لتثبيت الإضافة: ارفع ملفات الحزمة إلى GitHub Pages، وافتح الرابط، ثم اضغط «مساعدة» هناك لتنزيل ملف الإضافة المضبوط تلقائياً. التفاصيل في ملف README.txt داخل الحزمة.</p>`}
  <div class="acts"><button class="btn primary" data-close>حسناً</button></div>`;
  openModal(h,d=>{d.querySelector('[data-close]').onclick=closeModal;const m=d.querySelector('#h-man');if(m)m.onclick=()=>download('data:application/xml;charset=utf-8,'+encodeURIComponent(genManifest(base)),'manifest.xml');});
}

/* ================= file actions ================= */
function doSave(){download('data:application/json;charset=utf-8,'+encodeURIComponent(docPayload()),'marsam-drawing.json');toast('حُفظ الرسم كملف JSON');}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  if(/png$/i.test(f.type)||/\.png$/i.test(f.name))readPngFile(f,false);
  else{const r=new FileReader();r.onload=()=>{try{loadDoc(JSON.parse(r.result));}catch(err){toast('تعذّر قراءة الملف: ليس ملف رسم صالحاً');}};r.readAsText(f);}});
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;if(/png/i.test(f.type))readPngFile(f,true);else if(/json|marsam/i.test(f.name)){const r=new FileReader();r.onload=()=>{try{loadDoc(JSON.parse(r.result));}catch(err){}};r.readAsText(f);}});
document.addEventListener('paste',e=>{
  if(typing(e))return;const dt=e.clipboardData;if(!dt)return;
  for(const it of dt.items){if(it.type==='image/png'){const f=it.getAsFile();if(f){readPngFile(f,true);e.preventDefault();return;}}}
  const t=dt.getData('text/plain');
  if(t&&t.startsWith('MARSAM1:')){try{pasteFrag(JSON.parse(t.slice(8)),L*0.75,L*0.75);e.preventDefault();return;}catch(err){}}
  if(CLIP){pasteFrag(CLIP,L*0.75,L*0.75);e.preventDefault();}
});

/* ================= Word integration ================= */
const QS=new URLSearchParams(location.search);const MODE=QS.get('mode')||'';
let WORD=false,DIALOG=null;
function wmsg(s){$('#wmsg').textContent=s||'';}
function wordSize(w,h){const k=0.45*S_.wscale/100;return {w:w*k,h:h*k};}
async function wordInsert(){
  if(!D.atoms.length&&!D.arrows.length&&!D.texts.length){wmsg('الرسم فارغ.');return;}
  wmsg('جارٍ الإدراج…');
  try{
    const png=await makePng(4,false);const b64=png.url.split(',')[1];const sz=wordSize(png.w,png.h);const payload='MARSAM1:'+docPayload();
    await Word.run(async ctx=>{
      const s=ctx.document.getSelection();const pics=s.inlinePictures;pics.load('items/altTextTitle');s.load('text');await ctx.sync();
      let pic;
      if(pics.items.length&&pics.items[0].altTextTitle==='Marsam')pic=pics.items[0].insertInlinePictureFromBase64(b64,'Replace');
      else pic=s.insertInlinePictureFromBase64(b64,s.text&&s.text.trim()?'After':'Replace');
      pic.width=sz.w;pic.height=sz.h;pic.altTextTitle='Marsam';pic.altTextDescription=payload;
      await ctx.sync();
    });
    wmsg('أُدرج الرسم في المستند. لتعديله لاحقاً: حدّد الصورة ثم اضغط «تحرير الرسم المحدد».');
  }catch(err){wmsg('تعذّر الإدراج: '+(err&&err.message||err));}
}
async function wordLoad(){
  try{
    await Word.run(async ctx=>{const pics=ctx.document.getSelection().inlinePictures;pics.load('items/altTextTitle,items/altTextDescription');await ctx.sync();
      const p=pics.items.find(x=>x.altTextTitle==='Marsam')||pics.items[0];
      if(!p){wmsg('حدّد صورة رسم أُدرجت من مرسم أولاً.');return;}
      let doc=null;const desc=p.altTextDescription||'';
      if(desc.startsWith('MARSAM1:')){try{doc=JSON.parse(desc.slice(8));}catch(e){}}
      if(!doc){const b64=p.getBase64ImageSrc();await ctx.sync();try{const t=pngReadText(b64ToBytes(b64.value),'marsam');if(t)doc=JSON.parse(decodeURIComponent(t));}catch(e){}}
      if(!doc){wmsg('هذه الصورة ليست رسماً من مرسم، أو فقدت بياناته.');return;}
      loadDoc(doc);wmsg('حُمّل الرسم. عدّله ثم اضغط «إدراج في Word» لاستبدال الصورة المحددة.');});
  }catch(err){wmsg('تعذّرت القراءة: '+(err&&err.message||err));}
}
async function wordFormula(){
  const fs=currentFormulas();if(!fs.length){wmsg('لا يوجد مركب في الرسم.');return;}
  const html=fs.map(f=>fmtHTML(f.h)+(f.q?'<sup>'+chargeStr(f.q)+'</sup>':'')+' ('+f.m.toFixed(2)+' g/mol)').join('، ');
  try{await Word.run(async ctx=>{ctx.document.getSelection().insertHtml('<span style="font-family:Arial">'+html+'</span>','After');await ctx.sync();});wmsg('أُدرجت الصيغة.');}
  catch(err){wmsg('تعذّر الإدراج: '+(err&&err.message||err));}
}
async function checkWordSel(){
  try{await Word.run(async ctx=>{const pics=ctx.document.getSelection().inlinePictures;pics.load('items/altTextTitle');await ctx.sync();$('#w-load').classList.toggle('primary',pics.items.some(x=>x.altTextTitle==='Marsam'));});}catch(e){}
}
function openBig(){
  try{localStorage.setItem('marsam-handoff',docPayload());}catch(e){}
  const url=location.href.split(/[?#]/)[0]+'?mode=dialog';
  Office.context.ui.displayDialogAsync(url,{height:88,width:86,promptBeforeOpen:false},r=>{
    if(r.status!==Office.AsyncResultStatus.Succeeded){wmsg('تعذّر فتح النافذة: '+r.error.message);return;}
    DIALOG=r.value;
    DIALOG.addEventHandler(Office.EventType.DialogMessageReceived,async arg=>{
      let msg={};try{msg=JSON.parse(arg.message);}catch(e){}
      DIALOG.close();DIALOG=null;
      if(msg.action==='insert'){let doc=msg.doc;if(!doc){try{doc=JSON.parse(localStorage.getItem('marsam-handoff'));}catch(e){}}if(doc){loadDoc(doc);await wordInsert();}}
      else if(msg.action==='keep'){let doc=msg.doc;if(!doc){try{doc=JSON.parse(localStorage.getItem('marsam-handoff'));}catch(e){}}if(doc)loadDoc(doc);}
    });
    DIALOG.addEventHandler(Office.EventType.DialogEventReceived,()=>{DIALOG=null;});
  });
}
function dialogSend(action){
  const p=docPayload();try{localStorage.setItem('marsam-handoff',p);}catch(e){}
  Office.context.ui.messageParent(JSON.stringify(p.length<28000?{action,doc:JSON.parse(p)}:{action}));
}
function initOffice(){
  if(typeof Office==='undefined')return;
  Office.onReady(info=>{
    if(MODE==='dialog'){
      document.body.classList.add('in-dialog');$('#wordbar').hidden=false;
      $('#w-load').hidden=true;$('[data-act=w-formula]').hidden=true;$('#w-big').hidden=true;$('#w-cancel').hidden=false;
      $('#w-insert').onclick=()=>dialogSend('insert');$('#w-cancel').onclick=()=>dialogSend('keep');
      requestAnimationFrame(fit);return;
    }
    if(info&&info.host===Office.HostType.Word){
      WORD=true;$('#wordbar').hidden=false;requestAnimationFrame(fit);
      try{Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged,checkWordSel);}catch(e){}
      checkWordSel();
    }
  });
}
$('#wscale').addEventListener('input',e=>{S_.wscale=+e.target.value;$('#wscalev').textContent=S_.wscale+'%';savePrefs();});

/* ================= top bar ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  switch(b.dataset.act){
    case 'new':if(D.atoms.length||D.arrows.length||D.texts.length){D=emptyDoc();reindex();sel.clear();render();save();toast('رسم جديد — استخدم تراجع لاسترجاع السابق');}break;
    case 'open':$('#file').click();break;
    case 'save':doSave();break;
    case 'export':openExport();break;
    case 'undo':undo();break;case 'redo':redo();break;
    case 'rotl':transformSel(rot(-15),'rot');break;case 'rotr':transformSel(rot(15),'rot');break;
    case 'fliph':transformSel((x,y,c)=>[2*c.x-x,y],'flip');break;case 'flipv':transformSel((x,y,c)=>[x,2*c.y-y],'flip');break;
    case 'dup':dupSel();break;case 'del':delSel();break;
    case 'zin':{const r=cv.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2);break;}
    case 'zout':{const r=cv.getBoundingClientRect();zoomAt(0.8,r.width/2,r.height/2);break;}
    case 'fit':fit();break;
    case 'help':openHelp();break;
    case 'formula-text':{const fs=currentFormulas();if(!fs.length)break;computeLayouts();const bb=docBBox();
      const txt=fs.map(f=>fmtText(f.h)+(f.q?'^'+chargeStr(f.q):'')+'  ('+f.m.toFixed(2)+' g/mol)').join('    ');
      const ids=selAtomIds();let x=bb.x1,y=bb.y2+28;if(ids.size){let mx=Infinity,my=-Infinity;ids.forEach(id=>{const a=A(id);mx=Math.min(mx,a.x);my=Math.max(my,a.y);});x=mx-10;y=my+40;}
      D.texts.push({id:nid(),x,y,text:txt,formula:true,size:16});render();save();break;}
    case 'w-insert':wordInsert();break;case 'w-load':wordLoad();break;case 'w-formula':wordFormula();break;case 'w-big':openBig();break;
  }
});
$('#rail').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(b)setTool(b.dataset.tool);});

/* ================= example drawing ================= */
function example(){
  D=emptyDoc();reindex();
  // benzene + Cl2 --FeCl3--> chlorobenzene + HCl
  placeRing(6,true,null,{x:0,y:0});
  D.texts.push({id:nid(),x:62,y:7,text:'+',formula:false,size:22});
  const cl2=addAtom(112,0,'C');cl2.label='Cl2';
  D.arrows.push({id:nid(),x1:150,y1:0,x2:262,y2:0,type:'fwd',bend:-1});
  D.texts.push({id:nid(),x:176,y:-12,text:'FeCl3',formula:true,size:16});
  const before=new Set(D.atoms);placeRing(6,true,null,{x:330,y:6});
  const ring2=D.atoms.filter(a=>!before.has(a));const top=ring2.reduce((m,a)=>a.y<m.y?a:m);
  const cl=addAtom(top.x,top.y-L,'Cl');addBond(top,cl);
  D.texts.push({id:nid(),x:392,y:7,text:'+',formula:false,size:22});
  const hcl=addAtom(442,0,'C');hcl.label='HCl';
  // octahedral complex
  addComplex({geo:'oct',metal:'Co',ligs:['NH3'],arrows:false,brackets:true,charge:3,counter:'Cl3'},150,170);
  // ethanol with OH and a carbonyl compound
  const c1=addAtom(330,150),c2=addAtom(330+L*Math.cos(-P6),150+L*Math.sin(-P6)),o=addAtom(c2.x+L*Math.cos(P6),c2.y+L*Math.sin(P6),'O');
  addBond(c1,c2);addBond(c2,o,1);const o2=addAtom(c2.x,c2.y-L,'O');addBond(c2,o2,2);
  D.texts.push({id:nid(),x:300,y:215,text:'حمض الأسيتيك',formula:false,size:15});
  sel.clear();
}

/* ================= boot ================= */
loadPrefs();buildRail();setTool('b1');$('#wscale').value=S_.wscale;$('#wscalev').textContent=S_.wscale+'%';
let booted=false;
(function boot(){
  let src=null;
  if(MODE==='dialog'){try{src=localStorage.getItem('marsam-handoff');}catch(e){}}
  if(!src){try{src=localStorage.getItem(LSK);}catch(e){}}
  let ok=false;
  if(src){try{const o=JSON.parse(src);if(o&&o.atoms&&(o.atoms.length||o.arrows.length||o.texts.length)){D=Object.assign(emptyDoc(),o);reindex();ok=true;}}catch(e){}}
  if(!ok)example();
  HIST=[snapshot()];HP=0;updateUndo();
  render();requestAnimationFrame(()=>{fit();booted=true;});
})();
new ResizeObserver(()=>{if(booted&&!D.atoms.length)fit();}).observe(stage);
initOffice();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{WC.clear();render();});
window.__marsam={get D(){return D;},fragments,hill,parseFormula,render,exportSVG,makePng,loadDoc,setTool};
})();
